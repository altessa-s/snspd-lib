name: A clang that speaks C23
description: >
  Installs a clang new enough for this library on an Ubuntu runner and
  exports CC and CXX from the same toolchain. The clang the runner ships — 18 on Ubuntu 24.04 — reads
  C23 features incompletely; clang 19 supports the typed enums, nullptr
  and static_assert used by this library.
inputs:
  version:
    description: The major version of LLVM to install.
    required: false
    default: "19"
runs:
  using: composite
  steps:
    - name: Install clang ${{ inputs.version }}
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.version }}
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q "clang-$LLVM_VERSION" "libclang-rt-$LLVM_VERSION-dev"
        echo "CC=clang-$LLVM_VERSION" >> "$GITHUB_ENV"
        echo "CXX=clang++-$LLVM_VERSION" >> "$GITHUB_ENV"
        "clang-$LLVM_VERSION" --version | head -1
